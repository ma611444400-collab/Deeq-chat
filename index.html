<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deeq Chat</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .chat-container {
            width: 400px;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #333;
        }
        .chat-box {
            height: 300px;
            border: 1px solid #ddd;
            border-radius: 5px;
            padding: 10px;
            overflow-y: scroll;
            margin-bottom: 15px;
            background: #fafafa;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .message {
            padding: 8px 12px;
            border-radius: 5px;
            max-width: 80%;
            word-wrap: break-word;
        }
        .user-message {
            background-color: #007bff;
            color: white;
            align-self: flex-end;
        }
        .ai-message {
            background-color: #e9ecef;
            color: #333;
            align-self: flex-start;
        }
        .input-group {
            display: flex;
            gap: 10px;
        }
        input[type="text"] {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            outline: none;
        }
        button {
            padding: 10px 15px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <h2>Deeq Chat</h2>
        <div class="chat-box" id="chatBox">
            <div class="message ai-message">Ku soo dhowow Deeq Chat! Maxaan kaa caawiyaa maanta?</div>
        </div>
        <div class="input-group">
            <input type="text" id="userInput" placeholder="Halkan ku qor fariintaada...">
            <button id="sendBtn">Submit</button>
        </div>
    </div>

    <script>
        const sendBtn = document.getElementById('sendBtn');
        const userInput = document.getElementById('userInput');
        const chatBox = document.getElementById('chatBox');

        // Halkan ku beddel API Key-gaaga saxda ah
        const API_KEY = "AIzaSyBJnF4iE_1a9QXArdmRctFQofP6HMSkDN4"; 

        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        async function sendMessage() {
            const text = userInput.value.trim();
            if (text === '') return;

            // 1. Muuji fariintaada
            const userMsgDiv = document.createElement('div');
            userMsgDiv.classList.add('message', 'user-message');
            userMsgDiv.textContent = text;
            chatBox.appendChild(userMsgDiv);

            userInput.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            // 2. Muuji fariin sugitaan ah
            const aiMsgDiv = document.createElement('div');
            aiMsgDiv.classList.add('message', 'ai-message');
            aiMsgDiv.textContent = "Fikiraya...";
            chatBox.appendChild(aiMsgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                // 3. Dirista codsiga loo dirayo Gemini API
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{ text: text }]
                        }]
                    })
                });

                const data = await response.json();
                
                // 4. Soo bandhigida jawaabta ka timid AI-ga
                if (data.candidates && data.candidates.length > 0) {
                    const aiReply = data.candidates[0].content.parts[0].text;
                    aiMsgDiv.textContent = aiReply;
                } else {
                    aiMsgDiv.textContent = "Waan ka xumahay, jawaab lama helin.";
                }

                chatBox.scrollTop = chatBox.scrollHeight;

            } catch (error) {
                aiMsgDiv.textContent = "Waan ka xumahay, khalad dhanka shabakadda ah ayaa dhacay.";
            }
        }
    </script>

</body>
</html>
